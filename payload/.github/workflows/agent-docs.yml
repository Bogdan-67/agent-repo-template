name: agent-docs
on:
  pull_request:
jobs:
  docs-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harness wrappers in sync, skills valid
        run: python3 .agents/bin/sync.py --check
      - name: Documentation updated with the change
        run: python3 .agents/hooks/docs_guard.py ci --base "origin/${{ github.base_ref }}"
